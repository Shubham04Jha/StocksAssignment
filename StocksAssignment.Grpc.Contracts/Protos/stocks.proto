syntax = "proto3";

option csharp_namespace = "StocksAssignment.Grpc.Contracts";

package stocks;

service Stocks
{
    rpc GetStocks(GetStocksRequest)
        returns (GetStocksResponse);

    rpc GetCities(GetCitiesRequest)
        returns (GetCitiesResponse);

    rpc GetMakes(GetMakesRequest)
        returns (GetMakesResponse);
}

message GetStocksRequest
{
    repeated int32 fuelTypes = 1;

    optional int32 minBudgetLakhs = 2;

    optional int32 maxBudgetLakhs = 3;

    optional int32 cityId = 4;

    repeated int32 makeIds = 5;

    optional int32 so = 6;

    optional int32 sc = 7;
}

message Stock
{
    int32 stockId = 1;

    int32 makeId = 2;

    string makeName = 3;

    string modelName = 4;

    int32 registrationYear = 5;

    int32 fuelType = 6;

    int64 price = 7;

    int32 kilometersDriven = 8;

    int32 cityId = 9;
}

message GetStocksResponse
{
    repeated Stock stocks = 1;
}

message GetCitiesRequest {}

message City
{
    int32 cityId = 1;
    string cityName = 2;
}

message GetCitiesResponse
{
    repeated City cities = 1;
}

message GetMakesRequest {}

message Make
{
    int32 makeId = 1;
    string makeName = 2;
}

message GetMakesResponse
{
    repeated Make makes = 1;
}